name: Bug report
description: Report something that isn't working as intended
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in as much detail as you can

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: When I add a grade for a student, the average is not updated...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How would we make this bug happen?
      placeholder: |
        1. Run the backend with mvn spring-boot:run
        2. Go to http://localhost:5173/grades
        3. Click "Add grade"
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include error messages or screenshots.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - Backend
        - Frontend
        - Build / CI
        - Documentation
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, JDK and Node versions
      placeholder: macOS 26, JDK 17.0.21, Node 25.9.0

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant terminal output.
      render: shell
